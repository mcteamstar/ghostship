name: Release gate

on:
  pull_request:
    branches: [main]

jobs:
  release-gate:
    name: release-gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check source branch is a release branch
        run: |
          branch="${{ github.head_ref }}"
          if [[ "$branch" == release/* ]]; then
            echo "✓ Source branch '$branch' matches release/* — allowed to merge into main."
          else
            echo "✗ Source branch '$branch' does not match release/*."
            echo "  Only release/* branches may be merged into main."
            exit 1
          fi

      - name: Check VERSION matches the release branch name
        run: |
          branch="${{ github.head_ref }}"
          branch_version="${branch#release/}"
          version="$(cat VERSION)"
          if [[ "$branch_version" != "$version" ]]; then
            echo "✗ Branch 'release/$branch_version' does not match VERSION file ('$version')."
            echo "  A release/X.Y.Z branch must ship VERSION=X.Y.Z."
            exit 1
          else
            echo "✓ VERSION ($version) matches release branch name (release/$branch_version)."
          fi

      - name: Check plugin manifest versions match VERSION
        run: |
          version="$(cat VERSION)"
          fail=0
          for manifest in .claude-plugin/plugin.json .claude-plugin/.claude-plugin/plugin.json; do
            manifest_version="$(jq -r '.version' "$manifest")"
            if [[ "$manifest_version" != "$version" ]]; then
              echo "✗ $manifest has version '$manifest_version', VERSION file has '$version'."
              fail=1
            else
              echo "✓ $manifest matches VERSION ($version)."
            fi
          done
          exit "$fail"

      - name: Check skill versions match VERSION
        run: |
          version="$(cat VERSION)"
          fail=0
          for skill in .claude-plugin/skills/*/SKILL.md; do
            skill_version="$(grep -m1 '^  version:' "$skill" | sed 's/.*version: "\(.*\)"/\1/')"
            if [[ "$skill_version" != "$version" ]]; then
              echo "✗ $skill has version '$skill_version', VERSION file has '$version'."
              fail=1
            else
              echo "✓ $skill matches VERSION ($version)."
            fi
          done
          exit "$fail"
