name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r transport/requirements.txt

      - name: Run tests
        run: tests/run.sh --unit

      - name: Generate OpenAPI schema (TRN-129)
        run: python scripts/generate_openapi.py --output openapi.json

      - name: Upload OpenAPI schema artefact
        uses: actions/upload-artifact@v4
        with:
          name: openapi-schema
          path: openapi.json

  # trn-212-test-coverage-gaps E.1: run the shell integration tests on every
  # push/PR. The bash scripts under tests/integration use only POSIX tools and
  # stub binaries (stub podman/systemctl/id on PATH, sandboxed HOME), so no
  # Python or Podman setup is required here.
  #
  # E.2 — BRANCH PROTECTION (manual step, cannot be set from this file):
  #   Add "integration-tests" to the repo's required-status-check list for the
  #   `main` branch under Settings → Branches → Branch protection rules, so a PR
  #   cannot merge while these tests fail. GitHub exposes required status checks
  #   only through repo settings / the API, not through the workflow YAML, so
  #   this must be done once by a repo admin after this job first runs.
  integration-tests:
    name: integration-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run shell integration tests
        run: tests/run.sh --integration

  security-scan:
    name: security-scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # TRN-70 secrets-management 1.4 + input-validation 4.4: fail the build on
      # a committed live secret or on string-built SQL.
      - name: Security scan (secrets + unsafe queries)
        run: python3 tests/security_scan.py

