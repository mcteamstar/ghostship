schema_version: 1
review_cadence_days: 30
review_owner: Ghostship maintainers
components:
  - id: kirocrew-image
    name: KiroCrew base image
    category: inherited image
    declarations:
      - {kind: image_arg, path: crews/_base/admission/Containerfile, name: KC_BASE_IMAGE}
      - {kind: python_image_default, path: transport/config.py, name: kc_base_image}
      - {kind: manual, path: config/ghostship.yaml.example, term: 'kc_base_image:'}
      - {kind: manual, path: bin/lib/install_main.py, term: KC_BASE_IMAGE}
    source: {type: github_release, repository: kirodotdev/KiroCrew}
    version_policy: Immutable GHCR digest pin. GitHub release tags are candidates only; correlate each release with the published image digest before an upgrade.
    compatibility: {status: unknown, evidence: null}
    review: {owner: Ghostship maintainers, last_reviewed: 2026-11-08, outcome: candidate-observed, next_review: 2026-12-08, evidence: docs/dependency-review-2026-11-08.md}
    notes: No image build or installed-version inspection was performed for this inventory.
  - id: kiro-cli
    name: Kiro CLI bundled in KiroCrew
    category: derived component
    declarations: [{kind: derived, path: crews/_base/admission/Containerfile, parents: [kirocrew-image]}]
    source: {type: derived, parent: kirocrew-image}
    version_policy: Inherited; installed resolution unknown until image inspection.
    compatibility: {status: unknown, evidence: null}
    review: {owner: Ghostship maintainers, last_reviewed: 2026-11-08, outcome: installed-resolution-unknown, next_review: 2026-12-08, evidence: docs/dependency-review-2026-11-08.md}
    notes: A Containerfile comment reports 2.27.1 from a 2026-11-05 static layer inspection; this is not a current-workspace or current-built-image observation.
