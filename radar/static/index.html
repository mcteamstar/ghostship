<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ghostship Fleet Radar</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>👻</text></svg>">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div class="header">
    <h1>👻 Ghostship Fleet Radar</h1>
  </div>
  <div class="table-wrap">
  <table id="fleet-table">
    <thead>
      <tr id="status-row">
        <td colspan="7">
          <div id="status-bar">
            <span id="status-left">Loading&hellip;</span>
            <span id="capacity"></span>
          </div>
        </td>
      </tr>
      <tr>
        <th>Crew</th>
        <th>Status</th>
        <th>Backend</th>
        <th>Composition</th>
        <th>Uptime</th>
        <th class="sortable" style="cursor:pointer">Last Task</th>
        <th>Dashboard</th>
      </tr>
    </thead>
    <tbody id="fleet-body">
      <tr><td colspan="7" class="empty-cell">
        Fetching fleet data&hellip;
      </td></tr>
    </tbody>
  </table>
  </div>

  <script type="module" src="/static/main.js"></script>
</body>
</html>
